name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_USER: hikmah
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: hikmah
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://hikmah:local_ci_only@localhost:5432/hikmah
      BETTER_AUTH_SECRET: local-ci-only-auth-secret-with-over-32-characters
      BETTER_AUTH_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:3000
      DEMO_PASSWORD: generated-fixture-password-ci-only
      PDF_PYTHON: python3
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-core fonts-noto-extra poppler-utils
      - run: pip install weasyprint==66.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: EXPO_OFFLINE=1 pnpm --filter @hikmah/mobile exec expo install --check
      - run: EXPO_OFFLINE=1 pnpm --filter @hikmah/mobile exec expo export --platform ios --platform android
      - run: pnpm audit --prod --audit-level high
