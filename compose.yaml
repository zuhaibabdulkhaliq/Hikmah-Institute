services:
  db:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_USER: hikmah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hikmah_local_only}
      POSTGRES_DB: hikmah
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hikmah']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres:
