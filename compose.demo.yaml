# Local synthetic demo only. Use scripts/demo.sh to build and start it.
name: hikmah-demo
services:
  db:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_USER: hikmah
      POSTGRES_PASSWORD: ${HIKMAH_DEMO_DB_PASSWORD:?Run bash scripts/init-demo.sh first}
      POSTGRES_DB: hikmah
    volumes:
      - demo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hikmah"]
      interval: 2s
      timeout: 3s
      retries: 60
  api:
    image: hikmah-demo:local
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      DATABASE_URL: postgres://hikmah:${HIKMAH_DEMO_DB_PASSWORD}@db:5432/hikmah
      BETTER_AUTH_SECRET: ${HIKMAH_DEMO_AUTH_SECRET:?Run bash scripts/init-demo.sh first}
      BETTER_AUTH_URL: http://localhost:${HIKMAH_DEMO_PORT:-3000}
      WEB_ORIGIN: http://localhost:${HIKMAH_DEMO_PORT:-3000}
      DEMO_PASSWORD: ${HIKMAH_DEMO_PASSWORD:?Run bash scripts/init-demo.sh first}
      PDF_PYTHON: /opt/pdf/bin/python
      NEXT_TELEMETRY_DISABLED: "1"
    command:
      [
        "sh",
        "-c",
        "node --import tsx scripts/migrate.ts && node --import tsx scripts/seed.ts && node dist/api/main.js",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 90
  web:
    image: hikmah-demo:local
    pull_policy: never
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    command:
      [
        "node_modules/.bin/pnpm",
        "--filter",
        "@hikmah/web",
        "start",
        "--hostname",
        "0.0.0.0",
      ]
    ports:
      - "127.0.0.1:${HIKMAH_DEMO_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 60
volumes:
  demo-postgres:
